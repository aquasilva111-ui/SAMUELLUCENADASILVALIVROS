<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100">
  <rect width="1800" height="1100" fill="#fbfaf6"/>
  <text x="900" y="90" text-anchor="middle" font-family="Georgia, serif" font-size="46" fill="#1f1f1f">Matriz Visual dos Seis Livros</text>
  <text x="900" y="132" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#555">Direção contemporânea para criação editorial — não substitui pesquisa iconográfica histórica</text>

  <g font-family="Georgia, serif">
    <rect x="100" y="190" width="500" height="240" rx="18" fill="#f2eee4" stroke="#222" stroke-width="3"/>
    <text x="350" y="245" text-anchor="middle" font-size="32" fill="#222">AGRIPPA</text>
    <text x="350" y="290" text-anchor="middle" font-size="21" fill="#444">Renascentista • geométrico • erudito</text>
    <text x="350" y="330" text-anchor="middle" font-size="19" fill="#555">esferas • números • correspondências</text>
    <text x="350" y="370" text-anchor="middle" font-size="18" fill="#666">evitar fantasia e símbolos sem fonte</text>

    <rect x="650" y="190" width="500" height="240" rx="18" fill="#f2eee4" stroke="#222" stroke-width="3"/>
    <text x="900" y="245" text-anchor="middle" font-size="32" fill="#222">HEPTAMERON</text>
    <text x="900" y="290" text-anchor="middle" font-size="21" fill="#444">Temporal • ritual • ordenado</text>
    <text x="900" y="330" text-anchor="middle" font-size="19" fill="#555">sete dias • horas • sequência</text>
    <text x="900" y="370" text-anchor="middle" font-size="18" fill="#666">evitar anjos inventados e selos falsos</text>

    <rect x="1200" y="190" width="500" height="240" rx="18" fill="#f2eee4" stroke="#222" stroke-width="3"/>
    <text x="1450" y="245" text-anchor="middle" font-size="32" fill="#222">ARBATEL</text>
    <text x="1450" y="290" text-anchor="middle" font-size="21" fill="#444">Cosmológico • austero • simétrico</text>
    <text x="1450" y="330" text-anchor="middle" font-size="19" fill="#555">sete esferas • sete espíritos</text>
    <text x="1450" y="370" text-anchor="middle" font-size="18" fill="#666">evitar retratos fantasiosos</text>

    <rect x="100" y="500" width="500" height="240" rx="18" fill="#f2eee4" stroke="#222" stroke-width="3"/>
    <text x="350" y="555" text-anchor="middle" font-size="32" fill="#222">KEY OF SOLOMON</text>
    <text x="350" y="600" text-anchor="middle" font-size="21" fill="#444">Vitoriano • documental • gráfico</text>
    <text x="350" y="640" text-anchor="middle" font-size="19" fill="#555">pentáculos • pranchas • molduras</text>
    <text x="350" y="680" text-anchor="middle" font-size="18" fill="#666">nunca inventar hebraico ou sigilos</text>

    <rect x="650" y="500" width="500" height="240" rx="18" fill="#f2eee4" stroke="#222" stroke-width="3"/>
    <text x="900" y="555" text-anchor="middle" font-size="32" fill="#222">DE VITA</text>
    <text x="900" y="600" text-anchor="middle" font-size="21" fill="#444">Humanista • natural • contemplativo</text>
    <text x="900" y="640" text-anchor="middle" font-size="19" fill="#555">música • plantas • pedras • céu</text>
    <text x="900" y="680" text-anchor="middle" font-size="18" fill="#666">evitar grimório sombrio genérico</text>

    <rect x="1200" y="500" width="500" height="240" rx="18" fill="#f2eee4" stroke="#222" stroke-width="3"/>
    <text x="1450" y="555" text-anchor="middle" font-size="32" fill="#222">PICATRIX</text>
    <text x="1450" y="600" text-anchor="middle" font-size="21" fill="#444">Astral • manuscrito • geométrico</text>
    <text x="1450" y="640" text-anchor="middle" font-size="19" fill="#555">talismã • eleição • transmissão árabe-latina</text>
    <text x="1450" y="680" text-anchor="middle" font-size="18" fill="#666">evitar pseudo-árabe e orientalismo</text>
  </g>

  <rect x="220" y="825" width="1360" height="150" rx="22" fill="#ece6d8" stroke="#222" stroke-width="3"/>
  <text x="900" y="875" text-anchor="middle" font-family="Georgia, serif" font-size="28" fill="#222">REGRA DA COLEÇÃO</text>
  <text x="900" y="920" text-anchor="middle" font-family="Georgia, serif" font-size="21" fill="#444">Fonte histórica verificada → intervenção documentada → criação contemporânea claramente rotulada</text>
  <text x="900" y="955" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#666">NUC-MAGIA-REP-PLAN • Update 2026-10-17</text>
</svg>