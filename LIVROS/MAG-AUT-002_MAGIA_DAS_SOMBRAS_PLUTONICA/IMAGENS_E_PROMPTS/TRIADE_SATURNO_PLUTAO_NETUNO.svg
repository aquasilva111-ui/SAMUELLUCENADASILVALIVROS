    <text x="800" y="575" font-size="25" fill="#111111">CAPTURA A POTÊNCIA</text>

    <rect x="1090" y="170" width="430" height="450" rx="28" fill="none" stroke="#111111" stroke-width="3"/>
    <text x="1305" y="230" font-family="Georgia, serif" font-size="34" fill="#111111">NETUNO</text>
    <text x="1305" y="285" font-size="24" fill="#111111">Objetivo: DOMINAR LIVRE-ARBÍTRIO</text>
    <text x="1305" y="365" font-size="21" fill="#333333">alienação</text>
    <text x="1305" y="405" font-size="21" fill="#333333">+</text>
