  <text x="800" y="700" text-anchor="middle" font-family="Georgia, serif" font-size="27" fill="#222222">Eixo comum: autonomia</text>
  <text x="800" y="748" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#555555">A formulação netuniana ainda está em desenvolvimento; este diagrama organiza apenas o que já foi explicitamente definido.</text>
