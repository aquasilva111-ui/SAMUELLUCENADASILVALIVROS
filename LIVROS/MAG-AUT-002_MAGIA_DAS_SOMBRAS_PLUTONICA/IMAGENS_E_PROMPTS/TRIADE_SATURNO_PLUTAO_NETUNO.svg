    <text x="295" y="465" font-size="21" fill="#333333">↓</text>
    <text x="295" y="505" font-size="21" fill="#333333">repetição</text>
    <text x="295" y="575" font-size="25" fill="#111111">CAPTURA A SAÍDA</text>

    <rect x="585" y="170" width="430" height="450" rx="28" fill="none" stroke="#111111" stroke-width="3"/>
    <text x="800" y="230" font-family="Georgia, serif" font-size="34" fill="#111111">PLUTÃO</text>
    <text x="800" y="285" font-size="24" fill="#111111">Objetivo: CAPTURAR POTÊNCIA</text>
    <text x="800" y="345" font-size="21" fill="#333333">controle</text>
    <text x="800" y="385" font-size="21" fill="#333333">↓</text>
    <text x="800" y="425" font-size="21" fill="#333333">extração</text>
    <text x="800" y="465" font-size="21" fill="#333333">↓</text>
