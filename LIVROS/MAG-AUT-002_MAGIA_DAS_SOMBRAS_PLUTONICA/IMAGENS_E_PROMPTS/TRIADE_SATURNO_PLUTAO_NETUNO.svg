  <text x="800" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#444444">Mapa provisório da série — atualização 2026-10-17</text>

  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="80" y="170" width="430" height="450" rx="28" fill="none" stroke="#111111" stroke-width="3"/>
    <text x="295" y="230" font-family="Georgia, serif" font-size="34" fill="#111111">SATURNO</text>
    <text x="295" y="285" font-size="24" fill="#111111">Objetivo: APRISIONAR</text>
    <text x="295" y="345" font-size="21" fill="#333333">limite</text>
    <text x="295" y="385" font-size="21" fill="#333333">↓</text>
