  </text>

  <circle cx="1280" cy="565" r="280" fill="#FF8A1F" opacity="0.14"/>
  <circle cx="1280" cy="565" r="225" fill="url(#sphere)"/>

  <text x="1280" y="515" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700" fill="#171717">
    ESFERA LARANJA
  </text>
  <text x="1280" y="560" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#262626">
    masculinidade intuitiva
  </text>

  <text x="1280" y="630" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#2A2A2A">intuição integrada</text>
  <text x="1280" y="665" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#2A2A2A">delicadeza</text>
  <text x="1280" y="700" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#2A2A2A">conexão emocional e intelectual</text>
  <text x="1280" y="735" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#2A2A2A">autonomia identitária diante da mulher</text>

  <text x="1280" y="900" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#444">
