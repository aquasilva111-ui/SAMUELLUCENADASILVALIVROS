<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200">
  <defs>
    <radialGradient id="sphere" cx="42%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#FFD6A3"/>
      <stop offset="52%" stop-color="#FF9426"/>
      <stop offset="100%" stop-color="#D85300"/>
    </radialGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#777"/>
    </marker>
  </defs>

  <!-- PROVISÓRIO / SUGESTÃO IA — não representa sistema completo -->
  <rect width="1800" height="1200" fill="#F7F7F5"/>

  <text x="90" y="90" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" fill="#1D1D1D">
