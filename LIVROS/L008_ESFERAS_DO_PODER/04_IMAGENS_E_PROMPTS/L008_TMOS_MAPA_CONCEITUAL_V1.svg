  </text>

  <text x="180" y="540" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#444">• sobrevivência como eixo</text>
  <text x="180" y="595" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#444">• masculino carnal — definição aberta</text>
  <text x="180" y="650" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#444">• pertencimento e validação — investigar</text>
  <text x="180" y="705" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#444">• função saudável ainda a definir</text>

  <line x1="735" y1="565" x2="1010" y2="565" stroke="#777" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="872" y="525" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#666">
