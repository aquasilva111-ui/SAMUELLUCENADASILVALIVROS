  </text>
  <text x="90" y="140" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#666">
    Duas lógicas organizadoras em contraste; não é hierarquia, diagnóstico nem mapa científico.
  </text>

  <rect x="110" y="300" rx="28" ry="28" width="580" height="530" fill="#E7E7E3" stroke="#B9B9B4" stroke-width="3"/>
  <text x="400" y="380" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#2A2A2A">
    ESFERA EXISTENCIAL
  </text>
  <text x="400" y="430" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#555">
