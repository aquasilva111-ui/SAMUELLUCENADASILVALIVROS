<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#ffffff"/>
  <text x="800" y="62" text-anchor="middle" font-family="Georgia, serif" font-size="36" fill="#111111">ECONOMIA PSÍQUICA PLUTÔNICA</text>
  <text x="800" y="102" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#444444">Mapa conceitual de fluxos — 2026-10-17</text>

  <g font-family="Arial, sans-serif" text-anchor="middle" fill="#111111">
    <text x="210" y="175" font-size="24">FONTES DE POTÊNCIA</text>
    <rect x="70" y="205" width="280" height="390" rx="22" fill="none" stroke="#111111" stroke-width="3"/>
    <text x="210" y="260" font-size="20">trabalho</text>
    <text x="210" y="305" font-size="20">dinheiro</text>
    <text x="210" y="350" font-size="20">terra / recursos</text>
    <text x="210" y="395" font-size="20">conhecimento</text>
    <text x="210" y="440" font-size="20">criatividade</text>
    <text x="210" y="485" font-size="20">atenção</text>
    <text x="210" y="530" font-size="20">organização</text>
    <text x="210" y="575" font-size="20">energia psíquica</text>

    <text x="615" y="175" font-size="24">CONTROLE DO FLUXO</text>
    <rect x="475" y="265" width="280" height="260" rx="22" fill="none" stroke="#111111" stroke-width="3"/>
    <text x="615" y="330" font-size="20">acesso</text>
    <text x="615" y="375" font-size="20">circulação</text>
    <text x="615" y="420" font-size="20">conversão</text>
    <text x="615" y="465" font-size="20">destino</text>

    <text x="1010" y="175" font-size="24">EXTRAÇÃO</text>
    <rect x="870" y="285" width="280" height="220" rx="22" fill="none" stroke="#111111" stroke-width="3"/>
    <text x="1010" y="355" font-size="20">captura de frutos</text>
    <text x="1010" y="405" font-size="20">transferência</text>
    <text x="1010" y="455" font-size="20">dependência</text>

    <text x="1400" y="175" font-size="24">CONCENTRAÇÃO</text>
    <rect x="1260" y="245" width="280" height="300" rx="22" fill="none" stroke="#111111" stroke-width="3"/>
    <text x="1400" y="325" font-size="20">reserva</text>
    <text x="1400" y="375" font-size="20">capacidade de veto</text>
    <text x="1400" y="425" font-size="20">poder decisório</text>
    <text x="1400" y="475" font-size="20">domínio</text>
  </g>

  <g stroke="#111111" stroke-width="4" fill="none">
    <line x1="350" y1="400" x2="465" y2="400"/>
    <line x1="755" y1="400" x2="860" y2="400"/>
    <line x1="1150" y1="400" x2="1250" y2="400"/>
  </g>
  <g fill="#111111">
    <polygon points="465,400 445,389 445,411"/>
    <polygon points="860,400 840,389 840,411"/>
    <polygon points="1250,400 1230,389 1230,411"/>
  </g>

  <text x="800" y="690" text-anchor="middle" font-family="Georgia, serif" font-size="28" fill="#111111">Perguntas de controle</text>
  <text x="800" y="740" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#333333">Quem produz? Quem controla? Quem extrai? Quem acumula? Quem recebe os frutos? Quem consegue sair?</text>
  <text x="800" y="795" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#555555">“Energia psíquica” é linguagem conceitual da obra; o diagrama não a apresenta como grandeza física mensurável.</text>
</svg>
