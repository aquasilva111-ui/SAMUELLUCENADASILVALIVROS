<text x="1100" y="610" text-anchor="middle" class="t s">Cada capítulo investiga a mesma função em escalas diferentes, do organismo individual à civilização.</text>
<text x="1100" y="665" text-anchor="middle" class="t s">Correspondência não é identidade. A pesquisa histórica e fisiológica permanece distinta da interpretação metafísica.</text>
