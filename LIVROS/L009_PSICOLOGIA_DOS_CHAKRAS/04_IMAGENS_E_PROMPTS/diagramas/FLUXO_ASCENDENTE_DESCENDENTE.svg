<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="900" viewBox="0 0 1800 900">
<rect width="1800" height="900" fill="white"/>
<style>.t{font-family:Arial,Helvetica,sans-serif;fill:#111}.h{font-size:48px;font-weight:700}.s{font-size:28px}.b{font-size:30px;font-weight:700}</style>
<text x="900" y="80" text-anchor="middle" class="t h">Fluxo Ascendente e Descendente</text>
<text x="120" y="190" class="t b">ASCENDENTE</text>
<line x1="180" y1="260" x2="1620" y2="260" stroke="#111" stroke-width="6"/>
