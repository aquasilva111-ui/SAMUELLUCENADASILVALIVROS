<text x="1590" y="660" text-anchor="middle" class="t s">SENTIDO</text><text x="1360" y="660" text-anchor="middle" class="t s">compreensão</text><text x="1130" y="660" text-anchor="middle" class="t s">palavra</text><text x="900" y="660" text-anchor="middle" class="t s">vínculo</text><text x="670" y="660" text-anchor="middle" class="t s">decisão</text><text x="440" y="660" text-anchor="middle" class="t s">criação</text><text x="210" y="660" text-anchor="middle" class="t s">matéria</text>
<text x="900" y="790" text-anchor="middle" class="t s">As Esferas formam circuito funcional. Não existe hierarquia moral entre raiz e coroa.</text>
