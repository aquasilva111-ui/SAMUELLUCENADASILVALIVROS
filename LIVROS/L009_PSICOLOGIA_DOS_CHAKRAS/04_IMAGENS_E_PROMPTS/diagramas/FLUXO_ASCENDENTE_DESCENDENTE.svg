<text x="210" y="330" text-anchor="middle" class="t s">EXISTIR</text><text x="440" y="330" text-anchor="middle" class="t s">DESEJAR</text><text x="670" y="330" text-anchor="middle" class="t s">ESCOLHER</text><text x="900" y="330" text-anchor="middle" class="t s">VINCULAR-SE</text><text x="1130" y="330" text-anchor="middle" class="t s">EXPRESSAR</text><text x="1360" y="330" text-anchor="middle" class="t s">COMPREENDER</text><text x="1590" y="330" text-anchor="middle" class="t s">SENTIDO</text>
<text x="120" y="520" class="t b">DESCENDENTE</text>
