<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1800" viewBox="0 0 1200 1800">
<rect width="1200" height="1800" fill="white"/>
<style>
.t{font-family:Arial,Helvetica,sans-serif;fill:#111}.h{font-size:46px;font-weight:700}.s{font-size:25px}.q{font-size:21px}.n{font-size:28px;font-weight:700}
</style>
<text x="600" y="85" text-anchor="middle" class="t h">Mapa das Sete Esferas de Poder</text>
<text x="600" y="130" text-anchor="middle" class="t s">L009 — atualização 2026-10-17</text>
<line x1="600" y1="220" x2="600" y2="1600" stroke="#222" stroke-width="5"/>

<circle cx="600" cy="260" r="58" fill="white" stroke="#111" stroke-width="5"/>
<text x="600" y="270" text-anchor="middle" class="t n">07</text>
<text x="700" y="242" class="t n">Existencial Superior</text>
<text x="700" y="280" class="t q">Minha existência participa de algo maior que minha individualidade?</text>
<text x="700" y="315" class="t q">Correspondência: Pineal</text>

<circle cx="600" cy="470" r="58" fill="white" stroke="#111" stroke-width="5"/>
<text x="600" y="480" text-anchor="middle" class="t n">06</text>
<text x="700" y="452" class="t n">Intelectual</text>
<text x="700" y="490" class="t q">Consigo construir mapas sem confundir mapa e território?</text>
<text x="700" y="525" class="t q">Correspondência: Hipófise</text>

<circle cx="600" cy="680" r="58" fill="white" stroke="#111" stroke-width="5"/>
<text x="600" y="690" text-anchor="middle" class="t n">05</text>
<text x="700" y="662" class="t n">Expressão</text>
<text x="700" y="700" class="t q">Aquilo que existe dentro consegue atravessar para o mundo?</text>
<text x="700" y="735" class="t q">Correspondência: Tireoide / paratireoides</text>

<circle cx="600" cy="890" r="58" fill="white" stroke="#111" stroke-width="5"/>
<text x="600" y="900" text-anchor="middle" class="t n">04</text>
<text x="700" y="872" class="t n">Amor Pessoal</text>
<text x="700" y="910" class="t q">Consigo me vincular sem desaparecer dentro do outro?</text>
<text x="700" y="945" class="t q">Correspondência: Timo</text>

<circle cx="600" cy="1100" r="58" fill="white" stroke="#111" stroke-width="5"/>
<text x="600" y="1110" text-anchor="middle" class="t n">03</text>
<text x="700" y="1082" class="t n">Poder Pessoal</text>
<text x="700" y="1120" class="t q">Consigo querer, escolher e produzir efeito?</text>
<text x="700" y="1155" class="t q">Correspondência: Pâncreas / ilhotas</text>

<circle cx="600" cy="1310" r="58" fill="white" stroke="#111" stroke-width="5"/>
<text x="600" y="1320" text-anchor="middle" class="t n">02</text>
<text x="700" y="1292" class="t n">Sexual e Criativa</text>
<text x="700" y="1330" class="t q">Consigo desejar, receber prazer, misturar-me e criar?</text>
<text x="700" y="1365" class="t q">Correspondência: Gônadas</text>

<circle cx="600" cy="1520" r="58" fill="white" stroke="#111" stroke-width="5"/>
<text x="600" y="1530" text-anchor="middle" class="t n">01</text>
<text x="700" y="1502" class="t n">Existencial e Sobrevivência</text>
<text x="700" y="1540" class="t q">Consigo existir e permanecer existindo?</text>
<text x="700" y="1575" class="t q">Correspondência: Suprarrenais</text>

<text x="600" y="1700" text-anchor="middle" class="t s">EXISTIR → DESEJAR → ESCOLHER → VINCULAR-SE → EXPRESSAR → COMPREENDER → SENTIDO</text>
</svg>