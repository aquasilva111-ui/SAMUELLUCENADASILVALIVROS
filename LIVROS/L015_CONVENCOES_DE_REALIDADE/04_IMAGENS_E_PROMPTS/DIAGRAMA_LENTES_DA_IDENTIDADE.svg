<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc"><title id="title">Lentes da identidade social</title><desc id="desc">Um diagrama com sistemas sociais de classificação sobrepostos. Ilustração conceitual, sem dados empíricos.</desc><rect width="1200" height="780" fill="#f7f4ec"/><text x="600" y="80" text-anchor="middle" font-family="sans-serif" font-size="42" fill="#173e4b" font-weight="bold">LENTES DA IDENTIDADE SOCIAL</text><text x="600" y="119" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#536e76">Categorias que se cruzam, não essências biológicas</text><g opacity=".65"><circle cx="445" cy="339" r="180" fill="#79b5bc"/><circle cx="690" cy="339" r="180" fill="#d7a67f"/><circle cx="560" cy="484" r="180" fill="#b7b3d6"/></g><g font-family="sans-serif" font-size="24" fill="#163642" font-weight="bold"><text x="350" y="260" text-anchor="middle">Autodeclaração</text><text x="781" y="260" text-anchor="middle">Leitura social</text><text x="566" y="596" text-anchor="middle">Instituições</text></g><g fill="#173e4b"><circle cx="572" cy="381" r="46"/><rect x="531" y="420" width="82" height="91" rx="36"/></g><text x="600" y="713" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#536e76">Contexto • Tempo • Lugar • Relações • Poder</text><text x="600" y="745" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#536e76">Diagrama interpretativo · 2026-10-16 · Não representa estatísticas</text></svg>